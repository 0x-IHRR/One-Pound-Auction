services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: one_pound_auction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d one_pound_auction"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - one_pound_auction_postgres_data:/var/lib/postgresql/data

volumes:
  one_pound_auction_postgres_data:
